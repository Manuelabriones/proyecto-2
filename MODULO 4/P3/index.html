<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rick & Morty - Fetch y Axios</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>🛸 Rick & Morty</h1>

        <p>
            Consulta personajes utilizando Fetch o Axios
        </p>

        <div class="buttons">

            <button id="fetchBtn">
                Obtener con Fetch
            </button>

            <button id="axiosBtn">
                Obtener con Axios
            </button>

        </div>

        <p id="message"></p>

        <div id="data-container"></div>

    </main>


    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
