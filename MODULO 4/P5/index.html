<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Eventos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Registro de Eventos</h1>

        <p>
            Completa el formulario para registrarte al evento.
        </p>

        <form id="eventForm">

            <!-- Nombre -->
            <div class="form-group">

                <label for="name">
                    Nombre completo:
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Escribe tu nombre"
                >

                <small id="nameError"></small>

            </div>


            <!-- Correo -->
            <div class="form-group">

                <label for="email">
                    Correo electrónico:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="ejemplo@correo.com"
                >

                <small id="emailError"></small>

            </div>


            <!-- Teléfono -->
            <div class="form-group">

                <label for="phone">
                    Teléfono:
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="4491234567"
                >

                <small id="phoneError"></small>

            </div>


            <!-- Intereses -->
            <fieldset>

                <legend>
                    Selecciona tus intereses:
                </legend>

                <label>
                    <input
                        type="checkbox"
                        name="interest"
                        value="Tecnología"
                    >
                    Tecnología
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="interest"
                        value="Programación"
                    >
                    Programación
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="interest"
                        value="Diseño"
                    >
                    Diseño
                </label>

                <label>
                    <input
                        type="checkbox"
                        name="interest"
                        value="Innovación"
                    >
                    Innovación
                </label>

                <small id="interestError"></small>

            </fieldset>


            <!-- Horario -->
            <fieldset>

                <legend>
                    Elige tu horario preferido:
                </legend>

                <label>
                    <input
                        type="radio"
                        name="schedule"
                        value="Mañana"
                    >
                    Mañana
                </label>

                <label>
                    <input
                        type="radio"
                        name="schedule"
                        value="Tarde"
                    >
                    Tarde
                </label>

                <label>
                    <input
                        type="radio"
                        name="schedule"
                        value="Noche"
                    >
                    Noche
                </label>

                <small id="scheduleError"></small>

            </fieldset>


            <!-- Fecha -->
            <div class="form-group">

                <label for="date">
                    Fecha del evento:
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                >

                <small id="dateError"></small>

            </div>


            <!-- Archivo -->
            <div class="form-group">

                <label for="document">
                    Identificación (opcional):
                </label>

                <input
                    type="file"
                    id="document"
                    name="document"
                    accept=".pdf,.jpg,.jpeg,.png"
                >

                <small id="fileError"></small>

            </div>


            <button type="submit">
                Registrarme
            </button>

            <p id="successMessage"></p>

        </form>

    </main>


    <script src="script.js"></script>

</body>

</html>
